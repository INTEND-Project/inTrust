# ============================================================================
# Registry-size and request-variant experiment.
#
#   python -m benchmark.run_benchmark --config benchmark/config.registry_sweep.toml \
#          --experiment pilot_04
#
# Grows the skill registry with synthetic distractor capabilities
# (benchmark/distractors.py) and uses 20 request variants per scenario
# (benchmark/data/intents_extended/, v1-v5 identical to the published set).
# Everything else matches config.default.toml, except:
#   - measured_runs = 20: one run per variant.  Routing outcomes are
#     repeat-invariant under greedy decoding (verified across the published
#     campaigns), so a variant does not need repeats for routing metrics.
#   - num_ctx = 16384: a 32-skill registry does not fit the default 8192
#     context in the single-agent architecture; Ollama would silently truncate
#     the prompt and bias the comparison.  Applied to ALL registry sizes so
#     the sizes are comparable with each other.
#     Ollama reserves KV cache for num_ctx x OLLAMA_NUM_PARALLEL — submit with
#     OLLAMA_NUM_PARALLEL=1 (concurrency is 1 here anyway).
#
# ALWAYS set INTRUST_IMAGE_CACHE_DIR when submitting: registry pulls hit
# Docker Hub's rate limit (see prepare_docker_images.sh).  The extended
# variants reuse the same five images, so the existing cache covers them.
# ============================================================================

[general]
results_dir = "results"
ollama_api_base = "http://localhost:11434"
seed = 42
warmup_runs = 3
measured_runs = 20
run_timeout_sec = 1500

# ---- pilot: one model, smallest vs largest registry ------------------------
[experiments.pilot_04]
models = ["ollama_chat/qwen3.5:9b"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 0
intents_dir = "benchmark/data/intents_extended"

[experiments.pilot_32]
models = ["ollama_chat/qwen3.5:9b"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 28
intents_dir = "benchmark/data/intents_extended"

# ---- full sweep: 4 / 8 / 16 / 32 skills ------------------------------------
# DeepSeek-R1 is excluded: it emits no native calls (0% adherence), so its
# routing cannot change with registry size.
[experiments.registry_04]
models = ["ollama_chat/qwen3.5:9b", "ollama_chat/llama3.1:8b", "ollama_chat/orieg/gemma3-tools:12b-ft-v2"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 0
intents_dir = "benchmark/data/intents_extended"

[experiments.registry_08]
models = ["ollama_chat/qwen3.5:9b", "ollama_chat/llama3.1:8b", "ollama_chat/orieg/gemma3-tools:12b-ft-v2"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 4
intents_dir = "benchmark/data/intents_extended"

[experiments.registry_16]
models = ["ollama_chat/qwen3.5:9b", "ollama_chat/llama3.1:8b", "ollama_chat/orieg/gemma3-tools:12b-ft-v2"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 12
intents_dir = "benchmark/data/intents_extended"

[experiments.registry_32]
models = ["ollama_chat/qwen3.5:9b", "ollama_chat/llama3.1:8b", "ollama_chat/orieg/gemma3-tools:12b-ft-v2"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 28
intents_dir = "benchmark/data/intents_extended"

# ---- scaling study: Qwen3.5 sizes (9B is covered by registry_*) ------------
# The 4- and 32-skill endpoints are run first; 08 and 16 are defined so the
# grid can be completed later without a config change
# (see benchmark/slurm/submit_registry_sweep.sh, SCALING_SIZES).
[experiments.scaling_registry_04]
models = ["ollama_chat/qwen3.5:0.8b", "ollama_chat/qwen3.5:2b", "ollama_chat/qwen3.5:4b"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 0
intents_dir = "benchmark/data/intents_extended"

[experiments.scaling_registry_08]
models = ["ollama_chat/qwen3.5:0.8b", "ollama_chat/qwen3.5:2b", "ollama_chat/qwen3.5:4b"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 4
intents_dir = "benchmark/data/intents_extended"

[experiments.scaling_registry_16]
models = ["ollama_chat/qwen3.5:0.8b", "ollama_chat/qwen3.5:2b", "ollama_chat/qwen3.5:4b"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 12
intents_dir = "benchmark/data/intents_extended"

[experiments.scaling_registry_32]
models = ["ollama_chat/qwen3.5:0.8b", "ollama_chat/qwen3.5:2b", "ollama_chat/qwen3.5:4b"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 28
intents_dir = "benchmark/data/intents_extended"

# 27B runs on its own and is submitted as two scenario-pair jobs per registry
# size: its multi-agent flow loops (~500 s per request), so a full grid could
# approach the 24 h Slurm cap.
[experiments.scaling27b_registry_04]
models = ["ollama_chat/qwen3.5:27b"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 0
intents_dir = "benchmark/data/intents_extended"

[experiments.scaling27b_registry_08]
models = ["ollama_chat/qwen3.5:27b"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 4
intents_dir = "benchmark/data/intents_extended"

[experiments.scaling27b_registry_16]
models = ["ollama_chat/qwen3.5:27b"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 12
intents_dir = "benchmark/data/intents_extended"

[experiments.scaling27b_registry_32]
models = ["ollama_chat/qwen3.5:27b"]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]
extra_distractor_skills = 28
intents_dir = "benchmark/data/intents_extended"

[scenarios]
bandit_static_code = true
trivy_filesystem = true
trivy_docker_image = true
unsupported_request = true

[provider]
type = "ollama"
request_timeout_sec = 1200

[provider.model_kwargs]
think = false
num_predict = 1024
num_ctx = 16384
temperature = 0
