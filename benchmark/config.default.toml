# ============================================================================
# InTrust architecture benchmark — default configuration
#
# Copy this file and pass your copy with:  --config my_config.toml
# Everything the benchmark does is controlled from here; no code changes are
# needed to switch models, experiments, or scenarios.
# ============================================================================

[general]
# Where all benchmark outputs (raw data, plots, LaTeX, logs) are written.
# Relative paths are resolved against the repository root.
results_dir = "results"

# Base URL of the local Ollama server.
ollama_api_base = "http://localhost:11434"

# Random seed for framework-side reproducibility (run ordering etc.).
# Note: LLM token sampling happens inside the Ollama server and is not
# controlled by this seed.
seed = 42

# Number of unrecorded warm-up runs before measurement starts.  Warm-ups
# let the OS page in the model, fill caches, and download tool databases
# so they do not pollute the measured statistics.
warmup_runs = 5

# Number of measured runs per (architecture x model x scenario) cell.
measured_runs = 30

# Per-run timeout in seconds.  A run exceeding this is recorded as failed.
# Sized for the slowest case — the 27B model in the multi-agent architecture,
# whose 3-call chain can take many minutes per run.  Smaller models never
# approach this, so the timeout is not a limiting variable for them.
run_timeout_sec = 1500


# ----------------------------------------------------------------------------
# Experiment 1 — comparison across model families.
# Same benchmark, five different LLM families, concurrency fixed at 1.
#
# REQUIREMENT: every model must have the Ollama "tools" capability (check
# with `ollama show <tag>` — the capabilities list must include "tools")
# AND work through the litellm "ollama_chat" translation layer — verify any
# new model with one real run before a campaign.
#
# Notes on the selected models:
# - The Gemma entry is `orieg/gemma3-tools` — a community QLoRA fine-tune
#   of Gemma 3 for function calling, because stock gemma3 has no tools
#   capability on Ollama (methodology footnote: not stock Gemma).
# - The DeepSeek entry (stock deepseek-r1) REQUIRES A RECENT OLLAMA: old
#   servers (0.12) reject it with "does not support tools" because their
#   registry manifest predates tool support.  Use a user-local Ollama via
#   the Slurm jobs' OLLAMA_BIN variable (see README) — the campaign job's
#   auto-pull then refreshes the manifest.  The MFDoom community build was
#   tried and excluded: it emitted a correct tool call as unparsed text
#   (template artifact, see README failure modes).  Verified through the
#   current stack: deepseek-r1's 0% is genuine protocol non-adherence
#   (announces the dispatch in prose / emits routing JSON as text) and is
#   kept as a capability datapoint.
# - qwen3.5 also requires a recent Ollama (unavailable on 0.12).
# - qwen3.5 and deepseek-r1 are thinking-capable models; the benchmark
#   runs them with think=false (see [provider.model_kwargs]).
# Previously excluded: gemma3/phi4 (no tools capability), granite3.3
# (tool-calls natively but not through litellm — leaked ChatML tokens),
# mistral:7b / command-r7b / hermes3 (removed in the matrix redesign;
# mistral and command-r7b showed 0% protocol adherence, hermes3 worked).
# ----------------------------------------------------------------------------
[experiments.family_comparison]
models = [
    "ollama_chat/qwen3.5:9b",
    "ollama_chat/llama3.1:8b",
    "ollama_chat/orieg/gemma3-tools:12b-ft-v2",
    "ollama_chat/deepseek-r1:8b",
]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1]


# ----------------------------------------------------------------------------
# Experiment 2 — model scaling study (qwen3.5 family, five sizes from
# 0.8B to 27B).  Also exercises the throughput mode at several concurrency
# levels.  Requires a recent Ollama (see OLLAMA_BIN in the README).
#
# Excluded sizes: qwen3.5:35b (~24 GB — does not fit a 24 GB A30 once the
# KV cache is added) and qwen3.5:122b (~81 GB).  qwen3.5:27b (~17 GB) fits.
# ----------------------------------------------------------------------------
[experiments.scaling_study]
models = [
    "ollama_chat/qwen3.5:0.8b",
    "ollama_chat/qwen3.5:2b",
    "ollama_chat/qwen3.5:4b",
    "ollama_chat/qwen3.5:9b",
    "ollama_chat/qwen3.5:27b",
]
architectures = ["single_agent", "multi_agent"]
concurrency_levels = [1, 5, 10, 20]


# ----------------------------------------------------------------------------
# Assessment scenarios.  true = included in the benchmark.  Each scenario
# has FIVE frozen intent variants (different targets, varied phrasing) that
# runs rotate through — see benchmark/data/intents/.
#
# Three supported assessment types plus one gatekeeping test:
# - bandit_static_code : frozen Python modules (benchmark/data/bandit_targets/).
# - trivy_filesystem   : tiny frozen requirements.txt projects
#                        (benchmark/data/fs_targets/); scan takes seconds.
# - trivy_docker_image : public registry images.  No Docker engine needed —
#                        Trivy pulls from the registry directly.  First scan
#                        of each image downloads layers (warm-ups absorb it).
#                        Image contents / vuln DB evolve, which is fine:
#                        assessment accuracy is out of benchmark scope — the
#                        compared variables are orchestration properties.
# - unsupported_request: GATEKEEPING — requests that match NO available
#                        skill (port scan, DAST, TLS audit, licence audit,
#                        pen-test).  Correct behaviour is to select nothing;
#                        picking any skill is over-triggering (measured by
#                        routing accuracy, inverted for this scenario).
#
# The Kubernetes skill is NOT a scenario, but it remains loaded in every
# agent as a routing DISTRACTOR (a capability that is never the right
# answer).  A live-cluster scan is out of scope for the paper.
# ----------------------------------------------------------------------------
[scenarios]
bandit_static_code = true
trivy_filesystem = true
trivy_docker_image = true
unsupported_request = true


# ----------------------------------------------------------------------------
# LLM provider.  "ollama" routes every model string through ADK's LiteLlm
# wrapper pointed at ollama_api_base.  Additional providers (gemini, openai,
# ...) can be added in benchmark/model_factory.py without touching anything
# else.
# ----------------------------------------------------------------------------
[provider]
type = "ollama"

# Client-side timeout (seconds) for one LLM request.  Kept below the
# whole-run timeout so a stuck generation surfaces as a clear litellm
# timeout error instead of a silent hang.
request_timeout_sec = 1200

# Extra keyword arguments forwarded verbatim to every LiteLlm model.
# These are part of the recorded methodology (the config is echoed into the
# raw results JSON of every benchmark execution).
#
#   think = false   disables the hidden reasoning mode of thinking models
#                   (qwen3, deepseek-r1, ...).  Without this, thinking models
#                   generate hundreds of hidden tokens per step, which makes
#                   runs infeasible on CPU-only machines.  Applied to all
#                   models for uniformity; non-thinking models ignore it.
#   num_predict     hard cap on generated tokens per LLM call (guards
#                   against runaway generation).  IMPORTANT: when thinking
#                   is enabled, 1024 is far too small — the model burns the
#                   whole budget on reasoning and never emits the tool call.
#                   Use -1 (unlimited) or >= 8192 for thinking campaigns.
#   num_ctx         context window; Ollama's default (4096) is raised so
#                   prompt + tool schemas + response always fit.  Raise to
#                   >= 32768 for thinking campaigns (reasoning accumulates).
#   temperature     0 = greedy decoding — standard benchmark methodology:
#                   removes sampling luck from tool-call success, improves
#                   run-to-run reproducibility, and applies identically to
#                   both architectures.
[provider.model_kwargs]
think = false
num_predict = 1024
num_ctx = 8192
temperature = 0
